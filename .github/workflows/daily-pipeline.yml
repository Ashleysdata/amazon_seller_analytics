name: Daily pipeline

on:
  schedule:
    # 14:17 UTC = 7:17 AM Pacific (6:17 AM in winter). Runs once a day.
    - cron: "17 14 * * *"
  workflow_dispatch: # allows a manual run from the Actions tab
  push:
    branches: [main]
    paths: ["src/**", "sql/**", "requirements.txt"]

permissions:
  contents: write # needed to commit the refreshed data back to the repo

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Land new daily reports (extract)
        run: python src/generate_data.py

      - name: Build models, run data quality checks, publish (transform)
        run: python src/pipeline.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATA_THROUGH=$(ls data/raw/inventory | sort | tail -1 | sed 's/.csv//')
          git commit -m "data: daily refresh through ${DATA_THROUGH}"
          git push
